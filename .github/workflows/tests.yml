name: CI

on:
    push:
        branches: [ '1.9' ]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                sylius_version: [ "1.7", "1.8", "1.9" ]
                php_version: [ "7.3", "7.4" ]
                symfony_version: [ "4.4", "5.0" ]

        name: PHP ${{ matrix.php_version }} - Sylius ${{ matrix.sylius_version }} - Symfony ${{ matrix.symfony_version }}

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: mysql
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        env:
            DATABASE_URL: "mysql://root:mysql@127.0.0.1:3306/sylius_test?charset=utf8mb4"
            APP_ENV: test

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php_version }}
                    extensions: intl, pdo_mysql, gd, exif, mbstring
                    coverage: none

            -   name: Setup Node
                uses: actions/setup-node@v4
                with:
                    node-version: '14'

            -   name: Install Yarn
                run: npm install -g yarn

            -   name: Require specific Sylius and Symfony version
                run: |
                    composer require "sylius/sylius:${{ matrix.sylius_version }}.*" --no-interaction --no-update --no-scripts
                    grep -o -E '"(symfony/[^"]+)"' composer.json | grep -v -E '(symfony/flex|symfony/webpack-encore-bundle|symfony/maker-bundle|symfony/panther)' | xargs printf '%s:${{ matrix.symfony_version }}.* ' | xargs composer require --no-interaction --no-update

            # PREFER DIST
            -   name: Composer install (prefer-dist)
                run: composer update --no-interaction --prefer-dist --no-plugins

            -   name: Install assets
                run: (cd tests/Application && bin/console assets:install --env=test -vvv)

            -   name: Yarn install
                run: yarn --cwd tests/Application install

            -   name: Yarn build
                run: GULP_ENV=prod yarn --cwd tests/Application build

            -   name: Create database
                run: (cd tests/Application && bin/console doctrine:database:create --if-not-exists --env=test -vvv)

            -   name: Create schema
                run: (cd tests/Application && bin/console doctrine:schema:create --env=test -vvv) || (cd tests/Application && bin/console doctrine:schema:update --force --env=test -vvv)

            -   name: Cache warmup
                run: (cd tests/Application && bin/console cache:warmup --env=test -vvv)

            -   name: Run PHPStan
                run: bin/phpstan.sh

            -   name: Run PHPUnit
                run: vendor/bin/phpunit

            -   name: Run Behat
                run: vendor/bin/behat --no-interaction

            # PREFER LOWEST
            -   name: Reset database (before prefer-lowest)
                run: |
                    (cd tests/Application && bin/console doctrine:database:drop --force --if-exists --env=test -vvv)
                    (cd tests/Application && bin/console doctrine:database:create --env=test -vvv)
                    (cd tests/Application && bin/console doctrine:schema:create --env=test -vvv) || (cd tests/Application && bin/console doctrine:schema:update --force --env=test -vvv)

            -   name: Remove lock file
                run: rm -f composer.lock

            -   name: Composer install (prefer-lowest)
                run: composer update --no-interaction --prefer-lowest --no-plugins

            -   name: Install assets (prefer-lowest)
                run: (cd tests/Application && bin/console assets:install --env=test -vvv)

            -   name: Yarn install (prefer-lowest)
                run: yarn --cwd tests/Application install

            -   name: Yarn build (prefer-lowest)
                run: GULP_ENV=prod yarn --cwd tests/Application build

            -   name: Drop database (prefer-lowest)
                run: (cd tests/Application && bin/console doctrine:database:drop --force --if-exists --env=test -vvv)

            -   name: Create database (prefer-lowest)
                run: (cd tests/Application && bin/console doctrine:database:create --env=test -vvv)

            -   name: Create schema (prefer-lowest)
                run: (cd tests/Application && bin/console doctrine:schema:create --env=test -vvv) || (cd tests/Application && bin/console doctrine:schema:update --force --env=test -vvv)

            -   name: Clear cache (prefer-lowest)
                run: |
                    rm -fr tests/Application/var/cache
                    (cd tests/Application && bin/console cache:warmup --env=test -vvv)

            -   name: Run PHPStan (prefer-lowest)
                run: bin/phpstan.sh

            -   name: Run PHPUnit (prefer-lowest)
                run: vendor/bin/phpunit

            -   name: Run Behat (prefer-lowest)
                run: vendor/bin/behat --no-interaction
