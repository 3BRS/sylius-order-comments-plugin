services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    ThreeBRS\OrderCommentsPlugin\Form\Type\OrderMessageType:
        arguments:
            - '%three_brs_order_comments_plugin.model.order_message.class%'
        tags:
            - name: form.type

    ThreeBRS\OrderCommentsPlugin\Controller\OrderMessageController:
        tags:
            - 'controller.service_arguments'
        arguments:
            $router: '@router'
            $requestStack: '@request_stack'
            $translator: '@translator'
            $mailer: '@sylius.email_sender'
            $twig: '@twig'
            $builder: '@form.factory'
            $token: '@security.token_storage'
            $orderRepository: '@sylius.repository.order'
            $orderMessageRepository: '@three_brs_order_comments_plugin.repository.order_message'
